services:
  nginx:
    image: nginx:stable
    restart: on-failure:5
    ports:
      - "127.0.0.1:8888:80"
      - "127.0.0.1:443:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - ./src:/usr/share/nginx/epiphany
      - ./nginx:/etc/nginx/conf.d/:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php

  php:
    build:
      context: ./php
    restart: on-failure:5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    volumes:
      - ./src:/usr/share/nginx/epiphany
      - ./logs/securestack:/var/log/securestack
    environment:
      APP_ENV: development
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: on-failure:5
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data: #docker's own storage
