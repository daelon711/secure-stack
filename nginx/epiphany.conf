map $request_method $login_limit_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login_limit:10m rate=5r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name epiphany.test;

    ssl_certificate     /etc/nginx/certs/epiphany.crt;
    ssl_certificate_key /etc/nginx/certs/epiphany.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/epiphany;
    index index.php;


    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;


    if ($request_method !~ ^(GET|POST)$) {
        return 405;
    }
    
    location = /login.php {
        limit_req zone=login_limit burst=3 nodelay;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    location ~ \.php$ {
        fastcgi_pass php:9000;          
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ ^/(backups|staging|debug)(/.*)?$ {
        rewrite ^ /trap.php last;
    }

    location ~ ^/uploads/private(/.*)?$ {
        rewrite ^ /trap.php last;
    }

    location ~ /\. {
        deny all;
    }

location ~* \.cur$ {
   default_type image/vnd.microsoft.icon;

  add_header Content-Type "image/vnd.microsoft.icon" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self';" always;

}



}




server {
    listen 80;
    server_name epiphany.test;
    return 301 https://$host$request_uri;
}

